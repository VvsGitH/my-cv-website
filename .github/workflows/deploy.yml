name: Deploy to GitHub Pages

# A push to the default branch is the whole publishing action: build, capture
# the PDFs and preview images, deploy. The one-off repo setting it assumes is
# in README.md.

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: npm

      - run: npm i

      # Chromium only, and its own step rather than an npm hook (ADR-0009).
      - run: npx playwright install --with-deps chromium

      - run: npm run build

      # Before the upload, so a failed capture publishes nothing.
      - run: npm run captures:render

      # After the capture, so the suite can read the PDFs; before the upload, so a
      # regression publishes nothing. The runner, not `npm test` (ADR-0010).
      - run: npx playwright test

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
